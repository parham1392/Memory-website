<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090b12;color:#f5f7ff;font-family:Tahoma,Arial}
body{overflow-x:hidden}
:root{
--bg:#090b12;--card:#121827;--card2:#1a2133;
--muted:#aab2c5;--accent:#7658ff;--accent2:#00c9ff;
--danger:#ff5570;--border:rgba(255,255,255,.09)
}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:14px;padding:12px 16px;cursor:pointer;color:white;background:linear-gradient(135deg,var(--accent),#4e38d8)}
button.secondary{background:#20283a}
button.danger{background:rgba(255,85,112,.14);color:#ff7c91}
input,textarea,select{
width:100%;border:1px solid var(--border);
border-radius:14px;background:#0d1220;color:white;
padding:14px;outline:none
}
textarea{min-height:160px;resize:vertical}
.page{
min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:20px
}
.authBox{
width:min(430px,100%);padding:35px;
border-radius:28px;background:var(--card);
border:1px solid var(--border);text-align:center
}
.authIcon{font-size:65px}
.authBox input{margin-top:12px}
.authBox button{width:100%;margin-top:14px}
.error{color:#ff7c91;margin-top:12px;min-height:20px}
#app{display:none;max-width:1300px;margin:auto;padding:16px 16px 30px}
header{
display:flex;justify-content:space-between;
align-items:center;gap:15px;margin-bottom:20px
}
.logo{display:flex;gap:12px;align-items:center}
.logoIcon{
width:58px;height:58px;display:grid;place-items:center;
border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));
font-size:28px
}
.logo h1{margin:0;font-size:23px}
#liveDate{margin-top:5px;color:var(--muted);font-size:12px}
.headerButtons{display:flex;gap:8px}
.grid{
display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:20px
}
.panel{
background:var(--card);border:1px solid var(--border);
border-radius:24px;padding:18px
}
.panelTitle{font-size:19px;font-weight:bold;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;background:#0d1220}
.tab.active{background:linear-gradient(135deg,var(--accent),#4e38d8)}
.section{display:none}
.section.active{display:block}
.label{display:block;margin:14px 0 8px;color:var(--muted);font-size:13px}
.moodGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.mood{padding:10px 2px;background:#0d1220;font-size:20px}
.mood.selected{outline:2px solid var(--accent)}
.saveButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.recordArea{text-align:center;padding:15px 0}
.recordIcon{
width:105px;height:105px;border-radius:50%;
display:grid;place-items:center;margin:10px auto;
font-size:43px;background:#222a3d
}
.recordArea.recording .recordIcon{
background:var(--danger);animation:pulse 1s infinite
}
@keyframes pulse{50%{transform:scale(1.08)}}
#timer{font-size:25px;margin:15px}
.recordButtons{display:flex;justify-content:center;gap:8px}
.hidden{display:none!important}
audio{width:100%;margin-top:15px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:18px 0}
.memory{
background:var(--card2);border:1px solid var(--border);
border-radius:19px;padding:16px;margin-bottom:12px
}
.memoryHead{display:flex;justify-content:space-between;gap:8px}
.memoryTitle{font-weight:bold;font-size:17px}
.memoryMeta{font-size:12px;color:var(--muted);margin-top:6px}
.memoryText{white-space:pre-wrap;line-height:1.9;margin-top:14px}
.memoryFoot{
display:flex;align-items:center;
justify-content:space-between;gap:10px;margin-top:15px
}
.empty{text-align:center;color:var(--muted);padding:60px 15px}
footer{
text-align:center;
padding:30px 10px 15px;
font-size:11px;
color:#777
}
@media(max-width:850px){
#app{padding:12px 12px 30px}
header{flex-direction:column;align-items:stretch}
.headerButtons{justify-content:space-between}
.grid{grid-template-columns:1fr}
.filters{grid-template-columns:1fr}
.panel{padding:15px}
.saveButtons{grid-template-columns:1fr}
button,input,textarea,select{font-size:16px}
}
</style>
</head>

<body>

<div class="page" id="authPage">
<div class="authBox">

<div class="authIcon">🧠</div>
<h1 id="loginBrand">Memory</h1>

<div id="authTitle">خوش آمدی!</div>
<p id="authDescription">برای شروع، اسمت را وارد کن.</p>

<div id="setupFields">
<input id="userName" placeholder="اسم شما">
<input id="newPassword" type="password" placeholder="رمز عبور دلخواه">
<input id="confirmPassword" type="password" placeholder="تکرار رمز عبور">
<button onclick="register()">ساخت دفترچه من ✨</button>
</div>

<div id="loginFields" class="hidden">
<input id="loginPassword" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود به دفترچه 📖</button>
</div>

<div class="error" id="authError"></div>

</div>
</div>

<div id="app">

<header>
<div class="logo">
<div class="logoIcon">🧠</div>
<div>
<h1 id="siteName">Memory</h1>
<div id="welcome"></div>
<div id="liveDate"></div>
</div>
</div>

<div class="headerButtons">
<button class="secondary" onclick="toggleLanguage()" id="langBtn">🇬🇧 English</button>
<button class="secondary" onclick="logout()" id="logoutBtn">خروج</button>
</div>
</header>

<div class="grid">

<div class="panel">

<div class="panelTitle" id="newTitle">➕ خاطره جدید</div>

<div class="tabs">
<button class="tab active" id="textTab" onclick="switchTab('text')">✍️ متن</button>
<button class="tab" id="voiceTab" onclick="switchTab('voice')">🎙️ ویس</button>
</div>

<div class="section active" id="textSection">

<label class="label" id="textLabel">خاطره‌ات را بنویس</label>
<textarea id="textInput" placeholder="امروز چه اتفاقی افتاد؟"></textarea>

<label class="label" id="textMoodLabel">مود خاطره</label>

<div class="moodGrid" id="textMoods">
<button class="mood" data-mood="😀">😀</button>
<button class="mood" data-mood="🙂">🙂</button>
<button class="mood" data-mood="😐">😐</button>
<button class="mood" data-mood="😔">😔</button>
<button class="mood" data-mood="😡">😡</button>
<button class="mood" data-mood="🔥">🔥</button>
</div>

<div class="saveButtons">
<button class="secondary" onclick="saveMood('text')">😀 ثبت مود</button>
<button onclick="saveTextMemory()" id="saveTextBtn">✍️ ثبت خاطره متنی</button>
</div>

</div>

<div class="section" id="voiceSection">

<div class="recordArea" id="recordArea">
<div class="recordIcon">🎙️</div>
<div id="timer">00:00</div>

<div class="recordButtons">
<button id="recordBtn" onclick="startRecording()">🔴 شروع ضبط</button>
<button id="stopBtn" class="secondary hidden" onclick="stopRecording()">⏹ توقف</button>
</div>

<div id="voicePreview"></div>
</div>

<label class="label" id="voiceMoodLabel">مود خاطره</label>

<div class="moodGrid" id="voiceMoods">
<button class="mood" data-mood="😀">😀</button>
<button class="mood" data-mood="🙂">🙂</button>
<button class="mood" data-mood="😐">😐</button>
<button class="mood" data-mood="😔">😔</button>
<button class="mood" data-mood="😡">😡</button>
<button class="mood" data-mood="🔥">🔥</button>
</div>

<div class="saveButtons">
<button class="secondary" onclick="saveMood('voice')">😀 ثبت مود</button>
<button onclick="saveVoiceMemory()" id="saveVoiceBtn">🎙️ ثبت خاطره صوتی</button>
</div>

</div>
</div>

<div class="panel">

<div class="panelTitle" id="memoriesTitle">📖 خاطرات من</div>

<div class="filters">
<input id="searchInput" oninput="renderMemories()" placeholder="🔎 جستجو بر اساس اسم خاطره">

<select id="typeFilter" onchange="renderMemories()">
<option value="all">همه</option>
<option value="text">فقط متن</option>
<option value="voice">فقط ویس</option>
</select>

<input id="dateFilter" type="date" onchange="renderMemories()">
</div>

<div id="memoryCount"></div>
<div id="memoryList"></div>

</div>
</div>

<footer>
سازنده سایت: محمد پرهام اروجی
</footer>

</div>

<script>

let userName=localStorage.getItem("pm_name");
let savedPassword=localStorage.getItem("pm_password");

let language="fa";
let textMood="";
let voiceMood="";
let db=null;

let recorder;
let recordingStream;
let audioChunks=[];
let recordedBlob=null;
let recordingSeconds=0;
let recordingTimer=null;

const authPage=document.getElementById("authPage");

function initialize(){

if(!userName || !savedPassword){

document.getElementById("setupFields").classList.remove("hidden");
document.getElementById("loginFields").classList.add("hidden");

document.getElementById("authTitle").textContent="خوش اومدی! 🌟";
document.getElementById("authDescription").textContent=
"برای ساخت دفترچه شخصی خودت، اول اسمت و بعد رمزت رو تعیین کن.";

}else{

document.getElementById("setupFields").classList.add("hidden");
document.getElementById("loginFields").classList.remove("hidden");

document.getElementById("authTitle").textContent="خوش اومدی!";
document.getElementById("authDescription").textContent=
"رمز عبورت رو وارد کن تا وارد دفترچه بشی.";

document.getElementById("loginBrand").textContent=userName+"'s Memory";

}

}

function updateBrand(){

const name=userName.trim();

document.getElementById("siteName").textContent=name+"'s Memory";
document.getElementById("loginBrand").textContent=name+"'s Memory";
document.title=name+"'s Memory";

}

function register(){

const name=document.getElementById("userName").value.trim();
const pass=document.getElementById("newPassword").value;
const confirm=document.getElementById("confirmPassword").value;

if(!name || !pass || !confirm){
return showError("لطفاً همه قسمت‌ها را پر کن.");
}

if(pass.length<6){
return showError("رمز باید حداقل ۶ کاراکتر باشد.");
}

if(pass!==confirm){
return showError("رمزها یکسان نیستند.");
}

localStorage.setItem("pm_name",name);
localStorage.setItem("pm_password",pass);

userName=name;
savedPassword=pass;

enterApp();

}

function login(){

const pass=document.getElementById("loginPassword").value;

if(pass!==savedPassword){
return showError("رمز عبور اشتباه است.");
}

enterApp();

}

function showError(message){
document.getElementById("authError").textContent=message;
}

function enterApp(){

sessionStorage.setItem("pm_logged","true");

authPage.style.display="none";
document.getElementById("app").style.display="block";

updateBrand();

document.getElementById("welcome").textContent=
(language==="fa"?"خوش آمدی ":"Welcome ")+userName;

updateClock();
renderMemories();

}

function logout(){

sessionStorage.removeItem("pm_logged");
location.reload();

}

initialize();

/* دیتابیس */

let dbPromise=new Promise((resolve,reject)=>{

const request=indexedDB.open("ParhamMemoryDB",2);

request.onupgradeneeded=event=>{

const database=event.target.result;

if(!database.objectStoreNames.contains("memories")){
database.createObjectStore("memories",{keyPath:"id"});
}

};

request.onsuccess=event=>{
db=event.target.result;
resolve(db);
};

request.onerror=()=>reject(request.error);

});

async function dbReady(){
return await dbPromise;
}

dbPromise.then(()=>{

if(sessionStorage.getItem("pm_logged")==="true"){
enterApp();
}

});

/* زبان */

function toggleLanguage(){

language=language==="fa"?"en":"fa";

document.documentElement.lang=language;
document.documentElement.dir=language==="fa"?"rtl":"ltr";

updateBrand();

document.getElementById("langBtn").textContent=
language==="fa"?"🇬🇧 English":"🇮🇷 فارسی";

document.getElementById("logoutBtn").textContent=
language==="fa"?"خروج":"Logout";

document.getElementById("welcome").textContent=
(language==="fa"?"خوش آمدی ":"Welcome ")+userName;

document.getElementById("newTitle").textContent=
language==="fa"?"➕ خاطره جدید":"➕ New Memory";

document.getElementById("textTab").textContent=
language==="fa"?"✍️ متن":"✍️ Text";

document.getElementById("voiceTab").textContent=
language==="fa"?"🎙️ ویس":"🎙️ Voice";

document.getElementById("textLabel").textContent=
language==="fa"?"خاطره‌ات را بنویس":"Write your memory";

document.getElementById("textInput").placeholder=
language==="fa"?"امروز چه اتفاقی افتاد؟":"What happened today?";

document.getElementById("saveTextBtn").textContent=
language==="fa"?"✍️ ثبت خاطره متنی":"✍️ Save Text Memory";

document.getElementById("saveVoiceBtn").textContent=
language==="fa"?"🎙️ ثبت خاطره صوتی":"🎙️ Save Voice Memory";

document.getElementById("recordBtn").textContent=
language==="fa"?"🔴 شروع ضبط":"🔴 Start Recording";

document.getElementById("stopBtn").textContent=
language==="fa"?"⏹ توقف":"⏹ Stop";

document.getElementById("memoriesTitle").textContent=
language==="fa"?"📖 خاطرات من":"📖 My Memories";

document.getElementById("textMoodLabel").textContent=
language==="fa"?"مود خاطره":"Memory Mood";

document.getElementById("voiceMoodLabel").textContent=
language==="fa"?"مود خاطره":"Memory Mood";

document.getElementById("searchInput").placeholder=
language==="fa"?"🔎 جستجو بر اساس اسم خاطره":"🔎 Search by title";

const select=document.getElementById("typeFilter");

select.options[0].text=language==="fa"?"همه":"All";
select.options[1].text=language==="fa"?"فقط متن":"Text only";
select.options[2].text=language==="fa"?"فقط ویس":"Voice only";

updateClock();
renderMemories();

}

/* ساعت تهران */

function updateClock(){

const locale=language==="fa"?"fa-IR-u-ca-persian":"en-US";

document.getElementById("liveDate").textContent=
new Intl.DateTimeFormat(locale,{
timeZone:"Asia/Tehran",
year:"numeric",
month:"long",
day:"numeric",
weekday:"long",
hour:"2-digit",
minute:"2-digit",
hourCycle:"h23"
}).format(new Date());

}

setInterval(updateClock,1000);

/* تب ها */

function switchTab(tab){

document.getElementById("textSection").classList.toggle("active",tab==="text");
document.getElementById("voiceSection").classList.toggle("active",tab==="voice");

document.getElementById("textTab").classList.toggle("active",tab==="text");
document.getElementById("voiceTab").classList.toggle("active",tab==="voice");

}

/* انتخاب مود */

document.querySelectorAll("#textMoods .mood").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll("#textMoods .mood").forEach(x=>x.classList.remove("selected"));

btn.classList.add("selected");
textMood=btn.dataset.mood;

};

});

document.querySelectorAll("#voiceMoods .mood").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll("#voiceMoods .mood").forEach(x=>x.classList.remove("selected"));

btn.classList.add("selected");
voiceMood=btn.dataset.mood;

};

});

function saveMood(type){

const mood=type==="text"?textMood:voiceMood;

if(!mood){
alert("اول یک مود انتخاب کن.");
return;
}

alert("مود "+mood+" انتخاب شد.");

}

/* ذخیره خاطره */

async function saveMemory(memory){

const database=await dbReady();

return new Promise((resolve,reject)=>{

const tx=database.transaction("memories","readwrite");

tx.objectStore("memories").put(memory);

tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);

});

}

/* خاطره متنی */

async function saveTextMemory(){

const text=document.getElementById("textInput").value.trim();

if(!text){
alert("اول متن خاطره را بنویس.");
return;
}

const title=prompt("برای خاطره یک اسم بگذار:");

if(!title || !title.trim())return;

try{

await saveMemory({

id:crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random(),
type:"text",
title:title.trim(),
text:text,
mood:textMood,
createdAt:new Date().toISOString()

});

document.getElementById("textInput").value="";
textMood="";

document.querySelectorAll("#textMoods .mood").forEach(x=>x.classList.remove("selected"));

renderMemories();

alert("خاطره ذخیره شد ✅");

}catch(e){

alert("خطا در ذخیره خاطره.");

}

}

/* ضبط ویس */

async function startRecording(){

if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){

alert("این محیط از ضبط صدا پشتیبانی نمی‌کند.");
return;

}

try{

recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});

audioChunks=[];
recordedBlob=null;
recordingSeconds=0;
updateTimer();

recorder=new MediaRecorder(recordingStream);

recorder.ondataavailable=e=>{

if(e.data.size>0)audioChunks.push(e.data);

};

recorder.onstop=()=>{

recordedBlob=new Blob(audioChunks,{type:recorder.mimeType||"audio/webm"});

const audio=document.createElement("audio");

audio.controls=true;
audio.src=URL.createObjectURL(recordedBlob);

document.getElementById("voicePreview").innerHTML="";
document.getElementById("voicePreview").appendChild(audio);

recordingStream.getTracks().forEach(t=>t.stop());
recordingStream=null;

clearInterval(recordingTimer);

document.getElementById("recordArea").classList.remove("recording");
document.getElementById("recordBtn").classList.remove("hidden");
document.getElementById("stopBtn").classList.add("hidden");

};

recorder.start();

document.getElementById("recordArea").classList.add("recording");
document.getElementById("recordBtn").classList.add("hidden");
document.getElementById("stopBtn").classList.remove("hidden");

recordingTimer=setInterval(()=>{

recordingSeconds++;
updateTimer();

},1000);

}catch(e){

alert("دسترسی میکروفون داده نشد. تنظیمات مجوز میکروفون مرورگر را بررسی کن.");

}

}

function stopRecording(){

if(recorder&&recorder.state==="recording"){
recorder.stop();
}

}

function updateTimer(){

const m=String(Math.floor(recordingSeconds/60)).padStart(2,"0");
const s=String(recordingSeconds%60).padStart(2,"0");

document.getElementById("timer").textContent=m+":"+s;

}

/* ذخیره ویس */

async function saveVoiceMemory(){

if(!recordedBlob){
alert("اول یک ویس ضبط کن.");
return;
}

const title=prompt("برای این ویس یک اسم بگذار:");

if(!title||!title.trim())return;

try{

await saveMemory({

id:crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random(),
type:"voice",
title:title.trim(),
audio:recordedBlob,
mood:voiceMood,
createdAt:new Date().toISOString()

});

recordedBlob=null;
voiceMood="";

document.getElementById("voicePreview").innerHTML="";

document.querySelectorAll("#voiceMoods .mood").forEach(x=>x.classList.remove("selected"));

renderMemories();

alert("ویس ذخیره شد ✅");

}catch(e){

alert("خطا در ذخیره ویس.");

}

}

/* تاریخ تهران */

function tehranDateKey(dateString){

const parts=new Intl.DateTimeFormat("en-US",{
timeZone:"Asia/Tehran",
year:"numeric",
month:"2-digit",
day:"2-digit"
}).formatToParts(new Date(dateString));

const o={};

parts.forEach(p=>{
if(p.type!=="literal")o[p.type]=p.value;
});

return `${o.year}-${o.month}-${o.day}`;

}

function formatMemoryDate(dateString){

return new Intl.DateTimeFormat(
language==="fa"?"fa-IR-u-ca-persian":"en-US",
{
timeZone:"Asia/Tehran",
year:"numeric",
month:"long",
day:"numeric",
hour:"2-digit",
minute:"2-digit",
hourCycle:"h23"
}
).format(new Date(dateString));

}

/* خواندن خاطرات */

async function getAllMemories(){

const database=await dbReady();

return new Promise((resolve,reject)=>{

const tx=database.transaction("memories","readonly");

const req=tx.objectStore("memories").getAll();

req.onsuccess=()=>resolve(req.result||[]);
req.onerror=()=>reject(req.error);

});

}

/* نمایش خاطرات */

async function renderMemories(){

if(!db)return;

const container=document.getElementById("memoryList");

try{

let memories=await getAllMemories();

const search=document.getElementById("searchInput").value.toLowerCase().trim();
const type=document.getElementById("typeFilter").value;
const date=document.getElementById("dateFilter").value;

memories.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

memories=memories.filter(m=>{

return (m.title||"").toLowerCase().includes(search)
&&(type==="all"||m.type===type)
&&(!date||tehranDateKey(m.createdAt)===date);

});

document.getElementById("memoryCount").textContent=
language==="fa"?memories.length+" خاطره":memories.length+" memories";

container.innerHTML="";

if(memories.length===0){

container.innerHTML='<div class="empty">🧠<br><br>'+
(language==="fa"?"هنوز خاطره‌ای پیدا نشد.":"No memories found.")+
'</div>';

return;

}

memories.forEach(memory=>{

const card=document.createElement("div");
card.className="memory";

const head=document.createElement("div");
head.className="memoryHead";

const info=document.createElement("div");

const title=document.createElement("div");
title.className="memoryTitle";
title.textContent=(memory.type==="text"?"✍️ ":"🎙️ ")+memory.title;

const meta=document.createElement("div");
meta.className="memoryMeta";
meta.textContent=formatMemoryDate(memory.createdAt);

info.appendChild(title);
info.appendChild(meta);

const mood=document.createElement("div");
mood.textContent=memory.mood||"";

head.appendChild(info);
head.appendChild(mood);

card.appendChild(head);

if(memory.type==="text"){

const text=document.createElement("div");
text.className="memoryText";
text.textContent=memory.text||"";

card.appendChild(text);

}

if(memory.type==="voice"&&memory.audio){

const audio=document.createElement("audio");

audio.controls=true;
audio.src=URL.createObjectURL(memory.audio);

card.appendChild(audio);

}

const foot=document.createElement("div");
foot.className="memoryFoot";

const kind=document.createElement("span");

kind.style.color="var(--muted)";

/* حذف */

async function deleteMemory(id){

if(!confirm("این خاطره حذف شود؟"))return;

const database=await dbReady();

const tx=database.transaction("memories","readwrite");

tx.objectStore("memories").delete(id);

tx.oncomplete=()=>renderMemories();

}
